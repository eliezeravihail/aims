services:
  annotator:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Left side = host folders you provide. Right side = container mount points.
      - ./data/images:/data/images:ro          # input images (read-only)
      - ./data/annotations:/data/annotations    # annotation JSON output
      # Optional: override the project class list with your own file.
      # - ./my-classes.json:/srv/app/classes.default.json:ro
    environment:
      INPUT_DIR: /data/images
      ANNOTATIONS_DIR: /data/annotations
