<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instance Segmentation Annotator</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="nav">
      <button id="prevBtn" title="Previous image">‹</button>
      <span id="imageName">—</span>
      <button id="nextBtn" title="Next image">›</button>
    </div>
    <div class="tools">
      <label>Class:
        <select id="classSelect"></select>
      </label>
      <button id="finishBtn" title="Close current polygon (Enter)">Finish polygon</button>
      <button id="cancelBtn" title="Discard current polygon (Esc)">Cancel</button>
      <button id="fitBtn" title="Fit image to view">Fit</button>
      <button id="saveBtn" class="primary">Save</button>
    </div>
    <div id="status" class="status"></div>
  </header>

  <main>
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div class="hint">Left-click: add vertex · Enter/Finish: close (≥3) · Middle-drag: pan · Wheel: zoom</div>
    </div>
    <aside id="sidebar">
      <h2>Instances</h2>
      <ul id="instanceList"></ul>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
